name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mods:
    name: ${{ matrix.mod }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        mod:
          - cook-it-for-me
          - ata-bus-upgrade-b42
          - mma-combat

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/forge-live/package-lock.json

      - name: Set up Lua 5.1
        uses: leafo/gh-actions-lua@v13
        with:
          luaVersion: "5.1.5"

      - name: Install Forge Live dependencies
        working-directory: tools/forge-live
        run: npm ci

      - name: Check mod
        shell: pwsh
        run: ./tools/check.ps1 -Mod "${{ matrix.mod }}"
