name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mods:
    name: ${{ matrix.mod }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        mod:
          - cook-it-for-me
          - ata-bus-upgrade-b42
          - mma-combat

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/forge-live/package-lock.json

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@a102174a2b586eec2ea151a69e6fd14404a8ce7c # v1.13.0

      - name: Set up Lua 5.1
        uses: leafo/gh-actions-lua@6919171ccf181b826f44b9bca76307b577217377 # v13
        with:
          luaVersion: "5.1.5"

      - name: Install Forge Live dependencies
        working-directory: tools/forge-live
        run: npm ci

      - name: Check mod
        shell: pwsh
        run: ./tools/check.ps1 -Mod "${{ matrix.mod }}"
